<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta
      name="description"
      content="CyberChoices is an interactive cybersecurity decision game with banking, healthcare, and government campaigns."
    />
    <title>CyberChoices — Cyber Response Unit</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307111f'/%3E%3Cpath d='M32 8l20 8v14c0 13-8.4 22-20 27C20.4 52 12 43 12 30V16l20-8z' fill='%232dd4bf'/%3E%3Cpath d='M25 32l5 5 10-12' fill='none' stroke='%2307111f' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient-field" aria-hidden="true">
      <span class="ambient-orb ambient-orb-one"></span>
      <span class="ambient-orb ambient-orb-two"></span>
      <span class="ambient-line ambient-line-one"></span>
      <span class="ambient-line ambient-line-two"></span>
    </div>
    <div class="site-shell">
      <header class="topbar">
        <button class="brand" type="button" data-action="home" aria-label="CyberChoices home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" role="img">
              <path d="M16 3 27 7.5v7.7c0 7.1-4.6 12-11 14.8C9.6 27.2 5 22.3 5 15.2V7.5L16 3Z" />
              <path class="brand-check" d="m11.5 16 3 3 6-7" />
            </svg>
          </span>
          <span>
            <strong>CyberChoices</strong>
            <small>Cyber Response Unit</small>
          </span>
        </button>

        <div class="topbar-actions">
          <div class="saved-status" id="saved-status" aria-live="polite">Progress saved</div>
          <button class="icon-button" type="button" data-action="reset" aria-label="Reset all progress" title="Reset progress">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
              <path d="M3 3v5h5" />
            </svg>
          </button>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>
      <div class="sr-only" id="announcer" aria-live="assertive"></div>
    </div>

    <noscript>
      <div class="noscript">CyberChoices needs JavaScript enabled to run the interactive missions.</div>
    </noscript>
    <script src="scenarios.js"></script>
    <script src="app.js"></script>
  </body>
</html>
